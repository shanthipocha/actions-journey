name: secret-check
on: push

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Verify APP_TOKEN is available
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "APP_TOKEN is configured and available"
          else
            echo "APP_TOKEN is missing"
            exit 1
          fi
