name: release
on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Run lint check
        run: echo "Lint check passed"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Run unit tests
        run: echo "Unit tests passed"

  package:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Package application
        run: echo "Package job completed"
