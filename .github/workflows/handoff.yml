name: handoff
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create application file
        run: echo "Application package" > app.txt

      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.txt

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download application package
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Verify application file
        run: test -f app.txt
