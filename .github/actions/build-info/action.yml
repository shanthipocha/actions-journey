name: Build Info
description: Print build and repository information

runs:
  using: composite
  steps:
    - name: Show branch
      shell: bash
      run: echo "Branch: $GITHUB_REF_NAME"

    - name: Show commit
      shell: bash
      run: echo "Commit: $GITHUB_SHA"

    - name: Show repository
      shell: bash
      run: echo "Repository: $GITHUB_REPOSITORY"
